# Builds the installer and the portable app on every push to master and every pull request,
# and uploads both as downloadable artifacts (Actions tab -> the run -> Artifacts).
#
# Test builds are versioned 0.0.<run number>, so:
#   - they never look for updates (UpdateChecker skips 0.x versions), and
#   - the MSI won't install over a released Mapee (Windows sees it as a downgrade).
#     Uninstall Mapee first, or use the portable app.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    env:
      VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:VERSION

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Mapee-installer-${{ env.VERSION }}
          path: artifacts/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: Mapee-portable-${{ env.VERSION }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 30
